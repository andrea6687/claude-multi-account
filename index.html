<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Multi Account</title>
<meta name="description" content="Use two Claude Desktop accounts side by side on Mac or Windows, each with its own sign-in and icon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una colonna stretta, quattro passi in sequenza, il comando finale come "ricevuta" da copiare */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --ink: #1b1f2a;
  --muted: #5d6475;
  --line: #dde0e8;
  --code-bg: #1b1f2a;
  --code-fg: #e9ecf3;
  --pick: hsl(215, 62%, 52%);
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12141a; --surface: #1b1e27; --ink: #e8eaf1; --muted: #9aa1b2;
    --line: #2c3040; --code-bg: #0b0d12; --code-fg: #e9ecf3; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 640px; margin: 0 auto; padding-block: 48px 64px; display: flex; flex-direction: column; gap: 28px; }

header { display: flex; gap: 18px; align-items: center; }
.badge {
  flex: none; width: 64px; height: 64px; border-radius: 15px;
  background: linear-gradient(145deg, var(--pick), color-mix(in oklab, var(--pick), #000 28%));
  box-shadow: 0 6px 18px color-mix(in oklab, var(--pick), transparent 65%);
  display: grid; place-items: center; color: #fff;
  font: 700 22px/1 var(--display); letter-spacing: .02em;
  transition: background .3s, box-shadow .3s;
}
h1 { font: 700 clamp(28px, 6vw, 38px)/1.1 var(--display); margin: 0; text-wrap: balance; }
.lead { margin: 4px 0 0; color: var(--muted); }

section { display: flex; flex-direction: column; gap: 12px; }
.step { display: flex; align-items: baseline; gap: 10px; }
.step b {
  font: 500 12px/1 var(--mono); color: var(--pick); letter-spacing: .08em; text-transform: uppercase;
}
h2 { font: 600 17px/1.3 var(--body); margin: 0; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--surface); width: fit-content; }
.seg button {
  font: 500 15px var(--body); border: 0; background: none; color: var(--muted);
  padding: 8px 18px; border-radius: 7px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

input[type=text] {
  font: 16px var(--body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; width: 100%; max-width: 320px;
}
input[type=text]:focus-visible, button:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
#uninstall { word-break: break-all; }
.err { color: #c2362b; }

.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: none; border: 0; cursor: pointer; color: var(--muted); font: 13px var(--body); padding: 4px;
}
.swatch i {
  width: 42px; height: 42px; border-radius: 11px; display: block;
  border: 2px solid transparent; outline: 2px solid transparent; outline-offset: 2px;
}
.swatch[aria-pressed="true"] { color: var(--ink); font-weight: 600; }
.swatch[aria-pressed="true"] i { outline-color: var(--ink); }
.swatch.none i { background: repeating-linear-gradient(45deg, var(--line) 0 6px, transparent 6px 12px); border-color: var(--line); }

.receipt { background: var(--code-bg); color: var(--code-fg); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.receipt .where { font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; opacity: .65; }
.receipt pre {
  margin: 0; font: 14px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; min-width: 0;
}
.copy {
  align-self: flex-start; font: 600 15px var(--body); border: 0; border-radius: 9px; cursor: pointer;
  background: var(--pick); color: #fff; padding: 10px 18px; transition: background .3s;
}
.howto { margin: 0; padding-left: 20px; color: var(--ink); }
.howto li + li { margin-top: 4px; }
kbd { font: 13px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--surface); }

.note { border-left: 3px solid var(--pick); padding: 4px 0 4px 14px; }
.note h2 { margin-bottom: 4px; }
.note p { margin: 0; color: var(--muted); }
.top { display: flex; justify-content: flex-end; }
.lang button { padding: 5px 12px; font-size: 13px; }
footer { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
footer a { color: inherit; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="seg lang" role="group" aria-label="Language / Lingua">
      <button type="button" id="lang-en" data-lang="en">English</button>
      <button type="button" id="lang-it" data-lang="it">Italiano</button>
    </div>
  </div>

  <header>
    <div class="badge" id="badge" aria-hidden="true">C2</div>
    <div>
      <h1>Claude Multi Account</h1>
      <p class="lead" data-i="lead"></p>
    </div>
  </header>

  <section aria-labelledby="h-os">
    <div class="step"><b data-i="s1"></b><h2 id="h-os" data-i="os"></h2></div>
    <div class="seg" role="group" aria-labelledby="h-os">
      <button type="button" id="os-mac" data-os="mac">Mac</button>
      <button type="button" id="os-win" data-os="win">Windows</button>
    </div>
  </section>

  <section aria-labelledby="h-name">
    <div class="step"><b data-i="s2"></b><h2 id="h-name"><label for="name" data-i="name"></label></h2></div>
    <input type="text" id="name" value="Claude 2" maxlength="40" autocomplete="off" spellcheck="false">
    <p class="hint" id="name-hint"></p>
  </section>

  <section aria-labelledby="h-color">
    <div class="step"><b data-i="s3"></b><h2 id="h-color" data-i="color"></h2></div>
    <div class="swatches" id="swatches" role="group" aria-labelledby="h-color"></div>
  </section>

  <section aria-labelledby="h-run">
    <div class="step"><b data-i="s4"></b><h2 id="h-run" data-i="run"></h2></div>
    <div class="receipt">
      <span class="where" id="where"></span>
      <pre id="cmd"></pre>
      <button type="button" class="copy" id="copy"></button>
    </div>
    <ol class="howto" id="howto"></ol>
    <p class="hint" id="uninstall"></p>
  </section>

  <div class="note">
    <h2 data-i="firstTitle"></h2>
    <p data-i="first"></p>
  </div>

  <footer>
    <span data-i="footer"></span>
    <a href="https://github.com/andrea6687/claude-multi-account">GitHub</a>.
  </footer>
</main>

<script>
const RAW = "https://raw.githubusercontent.com/andrea6687/claude-multi-account/main/";
// [command value, hue shift in degrees, English label, Italian label]
const COLORS = [
  ["blue", 200, "blue", "blu"], ["green", 110, "green", "verde"], ["purple", 255, "purple", "viola"],
  ["pink", 315, "pink", "rosa"], ["cyan", 175, "cyan", "azzurro"], ["yellow", 35, "yellow", "giallo"],
  ["none", 0, "original", "originale"]
];
const BASE_HUE = 15; // Claude's icon starting hue

const TEXT = {
  en: {
    lead: "Two Claude Desktop accounts open at the same time, each with its own sign-in and icon.",
    s1: "Step 1", s2: "Step 2", s3: "Step 3", s4: "Step 4",
    os: "Your computer", name: "Name of the new app", color: "Icon color", run: "Copy and run the command",
    hintOk: "Letters, numbers, spaces, dashes.", hintBad: "Use only letters, numbers, spaces, - and _",
    hintReserved: "Claude and AnthropicClaude are reserved names.",
    hintId: "Use at least one letter or number.",
    fixName: "Fix the name in step 2.",
    remove: "Remove",
    copy: "Copy command", copied: "Copied", selected: "Selected: press Copy",
    whereMac: "Terminal · Mac", whereWin: "PowerShell · Windows",
    howMac: `<li>Open <b>Terminal</b>: press <kbd>⌘</kbd> <kbd>Space</kbd> and type "Terminal".</li>
             <li>Paste the command with <kbd>⌘</kbd> <kbd>V</kbd> and press <kbd>Return</kbd>.</li>
             <li>Claude Desktop must already be in /Applications. The Dock restarts for a moment.</li>
             <li>You'll find the new app in Applications (in your home folder) or with Spotlight.</li>`,
    howWin: `<li>Right-click the Start button and choose <b>Terminal</b> (or Windows PowerShell).</li>
             <li>Paste the command with <kbd>Ctrl</kbd> <kbd>V</kbd> and press <kbd>Enter</kbd>.</li>
             <li>You'll find the new shortcut on the Desktop and in the Start menu.</li>`,
    firstTitle: "The first sign-in",
    first: "In the new app don't use \"Continue with Google\". Type your email, press \"Continue with email\" and paste the code you receive into the window. If you click the link in the email, the other Claude opens instead. Alternatively, fully quit the main Claude before signing in.",
    footer: "Unofficial tool, not affiliated with Anthropic. It doesn't modify the Claude app: it launches it with a separate data folder. Code on"
  },
  it: {
    lead: "Due account di Claude Desktop aperti insieme, ognuno con il suo login e la sua icona.",
    s1: "Passo 1", s2: "Passo 2", s3: "Passo 3", s4: "Passo 4",
    os: "Il tuo computer", name: "Nome della nuova app", color: "Colore dell'icona", run: "Copia ed esegui il comando",
    hintOk: "Lettere, numeri, spazi, trattini.", hintBad: "Usa solo lettere, numeri, spazi, - e _",
    hintReserved: "I nomi Claude e AnthropicClaude sono riservati.",
    hintId: "Serve almeno una lettera o un numero.",
    fixName: "Correggi il nome al passo 2.",
    remove: "Rimuovi",
    copy: "Copia comando", copied: "Copiato", selected: "Selezionato: premi Copia",
    whereMac: "Terminale · Mac", whereWin: "PowerShell · Windows",
    howMac: `<li>Apri il <b>Terminale</b>: premi <kbd>⌘</kbd> <kbd>Spazio</kbd> e scrivi "Terminale".</li>
             <li>Incolla il comando con <kbd>⌘</kbd> <kbd>V</kbd> e premi <kbd>Invio</kbd>.</li>
             <li>Claude Desktop deve già essere in /Applications. Il Dock si riavvia per un attimo.</li>
             <li>Trovi la nuova app in Applicazioni (nella tua cartella Inizio) o con Spotlight.</li>`,
    howWin: `<li>Clicca col tasto destro sul pulsante Start e scegli <b>Terminale</b> (o Windows PowerShell).</li>
             <li>Incolla il comando con <kbd>Ctrl</kbd> <kbd>V</kbd> e premi <kbd>Invio</kbd>.</li>
             <li>Trovi il nuovo collegamento sul Desktop e nel menu Start.</li>`,
    firstTitle: "Il primo accesso",
    first: "Nella nuova app non usare \"Continua con Google\". Scrivi l'email, premi \"Continua con email\" e incolla nella finestra il codice che ricevi. Se clicchi il link nell'email si apre l'altro Claude. In alternativa, chiudi del tutto il Claude principale prima di accedere.",
    footer: "Strumento non ufficiale, non affiliato ad Anthropic. Non modifica l'app Claude: la avvia con una cartella dati separata. Codice su"
  }
};

function savedLang() { try { return localStorage.getItem("lang"); } catch { return null; } }
const state = {
  lang: savedLang() || (/^it\b/i.test(navigator.language || "") ? "it" : "en"),
  os: /Win/i.test(navigator.userAgent) ? "win" : "mac",
  name: "Claude 2",
  color: "blue"
};

const $ = id => document.getElementById(id);
const hueFor = c => (BASE_HUE + (COLORS.find(x => x[0] === c)?.[1] || 0)) % 360;
function nameProblem(n) {
  const t = (n || "").trim();
  if (!t) return "";
  if (!/^[A-Za-z0-9 _-]+$/.test(t)) return "bad";
  if (/^(claude|anthropicclaude)$/i.test(t)) return "reserved";
  if (!/[A-Za-z0-9]/.test(t)) return "id";
  return "";
}

// Color chips
const sw = $("swatches");
COLORS.forEach(([c]) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "swatch" + (c === "none" ? " none" : ""); b.dataset.c = c; b.id = "c-" + c;
  const i = document.createElement("i");
  if (c !== "none") i.style.background = `hsl(${hueFor(c)}, 62%, 56%)`;
  const label = document.createElement("span");
  b.append(i, label);
  b.onclick = () => { state.color = c; render(); };
  sw.append(b);
});
document.querySelectorAll("[data-os]").forEach(b => b.onclick = () => { state.os = b.dataset.os; render(); });
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => {
  state.lang = b.dataset.lang;
  try { localStorage.setItem("lang", state.lang); } catch {}
  render();
});
$("name").addEventListener("input", e => { state.name = e.target.value; render(); });

function command() {
  const n = state.name.trim() || "Claude 2";
  if (state.os === "mac") {
    return `curl -fsSL ${RAW}install.sh | bash -s -- "${n}" ${state.color}`;
  }
  return `& ([scriptblock]::Create((irm ${RAW}install.ps1))) "${n}" ${state.color}`;
}

function render() {
  const T = TEXT[state.lang];
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = T[el.dataset.i]; });
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === state.lang));
  document.querySelectorAll(".swatch").forEach(b => {
    const row = COLORS.find(x => x[0] === b.dataset.c);
    b.querySelector("span").textContent = state.lang === "it" ? row[3] : row[2];
    b.setAttribute("aria-pressed", b.dataset.c === state.color);
  });

  const problem = state.name.trim() ? nameProblem(state.name) : "";
  const ok = !problem;
  const hint = $("name-hint");
  hint.textContent = problem === "reserved" ? T.hintReserved : problem === "id" ? T.hintId : problem ? T.hintBad : T.hintOk;
  hint.classList.toggle("err", !ok);

  document.querySelectorAll("[data-os]").forEach(b => b.setAttribute("aria-pressed", b.dataset.os === state.os));

  const pick = state.color === "none" ? "hsl(15, 62%, 56%)" : `hsl(${hueFor(state.color)}, 62%, 52%)`;
  document.documentElement.style.setProperty("--pick", pick);
  const n = (state.name.trim() || "Claude 2");
  $("badge").textContent = n.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase() || "C2";

  $("cmd").textContent = ok ? command() : T.fixName;
  $("copy").disabled = !ok;
  $("copy").textContent = T.copy;
  $("where").textContent = state.os === "mac" ? T.whereMac : T.whereWin;
  $("howto").innerHTML = state.os === "mac" ? T.howMac : T.howWin;
  const shown = state.name.trim() || "Claude 2";
  const removeCmd = state.os === "mac"
    ? `curl -fsSL ${RAW}install.sh | bash -s -- --uninstall "${shown}"`
    : `& ([scriptblock]::Create((irm ${RAW}install.ps1))) -Uninstall "${shown}"`;
  $("uninstall").textContent = ok ? `${T.remove}: ${removeCmd}` : "";
}

$("copy").onclick = async () => {
  const btn = $("copy"), T = TEXT[state.lang];
  try {
    await navigator.clipboard.writeText($("cmd").textContent);
    btn.textContent = T.copied;
  } catch {
    const r = document.createRange(); r.selectNodeContents($("cmd"));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    btn.textContent = T.selected;
  }
  setTimeout(() => btn.textContent = TEXT[state.lang].copy, 2200);
};

render();
</script>
</body>
</html>
